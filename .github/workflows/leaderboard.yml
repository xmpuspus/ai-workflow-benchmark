name: Publish leaderboard

# Builds the static HTML leaderboard from results/baselines/<version>.json
# and deploys to GitHub Pages whenever a baseline file changes or on demand.
#
# Provides the "live published leaderboard" Phase 4 deliverable. Real
# baseline numbers must be generated locally with API keys (see
# scripts/generate_baseline.py) and committed to results/baselines/.

on:
  push:
    branches: [main]
    paths:
      - "results/baselines/**"
      - "awb/leaderboard/**"
      - "scripts/build_leaderboard_site.py"
      - ".github/workflows/leaderboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install awb
        run: pip install -e .
      - name: Render static baseline index
        run: >-
          python scripts/build_leaderboard_site.py
          --baselines results/baselines --out site
          --static awb/leaderboard/static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
