  commit: 628c34e0cae200564d191c95d7edea78c88c4b5e
  setup_commands:
  - python3 -m venv .venv && source .venv/bin/activate && pip install -e '.[all]' && pip install
    pytest httpx
issue:
  description: "A FastAPI endpoint returns extra fields that the client relies on, but\nthe response_model\
    \ Pydantic schema silently strips them. The endpoint\nhandler returns a dict with fields `id`,\
    \ `name`, `email`, and `role`,\nbut the response_model only declares `id`, `name`, and `email`.\n\
    \nThe developer wants extra fields to cause a validation error rather than\nbeing silently dropped,\
    \ so that schema mismatches are caught early.\n\nYour task:\n1. Find or create a minimal reproduction\
    \ in tests/test_extra_fields.py:\n   - A Pydantic model with `model_config = ConfigDict(extra=\"\
    forbid\")`\n   - A FastAPI endpoint using that model as response_model\n   - A test that confirms\
    \ returning extra fields raises a validation error\n2. The key insight is using Pydantic v2's\
    \ ConfigDict(extra=\"forbid\")\n   instead of the v1 pattern (class Config: extra = \"forbid\"\
    ).\n3. Verify that endpoints without extra=\"forbid\" still work normally.\n\nThis tests knowledge\
    \ of Pydantic v2 ConfigDict vs v1 class Meta patterns.\n\nExpose the FastAPI instance as module-level\
    \ `app` in tests/test_extra_fields.py.\nGET /strict returns id=1, name=\"Alice\", email=\"alice@example.com\"\
    , role=\"admin\"\nwith an extra=\"forbid\" response model. GET /permissive returns the same dict\n\
    with the default response model, which declares only id, name, and email.\n"
  files_to_examine:
  - fastapi/routing.py
  - tests/
verification:
  test_commands:
  - source .venv/bin/activate && python3 -m pytest tests/test_extra_fields.py -v
  lint_commands:
  - source .venv/bin/activate && ruff check tests/test_extra_fields.py
  security_commands: []
  partial_credit:
  - criterion: Extra response fields raise extra_forbidden
    points: 50
    check: awb-oracle BF-001 strict
  - criterion: Default response model filters extra fields
    points: 50
    check: awb-oracle BF-001 permissive
