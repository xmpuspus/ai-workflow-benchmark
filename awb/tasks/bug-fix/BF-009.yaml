  commit: 628c34e0cae200564d191c95d7edea78c88c4b5e
  setup_commands:
  - python3 -m venv .venv && source .venv/bin/activate && pip install -e '.[all]' && pip install
    pytest httpx
issue:
  description: "Two modules import from each other. Python resolves the cycle at import\ntime by\
    \ giving each module a partially-initialized version of the other,\nso top-level names are defined\
    \ but names assigned later in the file are\nmissing. This causes AttributeError only when the\
    \ affected function is\nactually called, not when the modules are first imported.\n\nYour task:\n\
    1. Create models/user.py with:\n   from services.auth import hash_password\n\n   class User:\n\
    \       def __init__(self, username: str, password: str):\n           self.username = username\n\
    \           self.password_hash = hash_password(password)\n\n2. Create services/auth.py with:\n\
    \   from models.user import User\n\n   def hash_password(password: str) -> str:\n       return\
    \ f\"hashed:{password}\"\n\n   def create_user(username: str, password: str) -> User:\n     \
    \  return User(username, password)\n\nTHE BUG: models/user.py imports from services/auth.py,\
    \ and services/auth.py\nimports from models/user.py. Python partially evaluates both modules.\
    \ When\nservices/auth.py is being evaluated, it reaches `from models.user import User`\nand gets\
    \ a partially-built models.user that does not yet have User defined.\nThe import itself may not\
    \ fail, but calling create_user() will raise\nAttributeError: partially initialized module 'models.user'\
    \ has no attribute 'User'.\n\n3. Create tests/test_circular_import.py with:\n   - test_import_succeeds:\
    \ importing both modules does not raise ImportError\n     (the cycle may resolve at import time)\n\
    \   - test_create_user_raises_before_fix: calling services.auth.create_user()\n     raises AttributeError\
    \ or NameError due to the circular dependency\n     (document this as the bug; this test should\
    \ be inverted after the fix)\n   - test_create_user_works_after_fix: after the fix, create_user(\"\
    alice\", \"pw\")\n     returns a User with username=\"alice\" and a non-empty password_hash\n\
    \nThe fix: create models/base.py with shared type definitions (User dataclass\nor TypedDict),\
    \ remove the circular dependency. Neither module should import\nfrom the other. Or use TYPE_CHECKING\
    \ for type annotations only:\n   from __future__ import annotations\n   from typing import TYPE_CHECKING\n\
    \   if TYPE_CHECKING:\n       from models.user import User\n\nThe TYPE_CHECKING approach is acceptable\
    \ only if the runtime code does not\nactually need the User class at call time (only for type\
    \ hints). If User is\ninstantiated in services/auth.py, it must be a real runtime import \u2014\
    \ use\nmodels/base.py instead.\n"
  files_to_examine:
  - fastapi/routing.py
  - tests/
verification:
