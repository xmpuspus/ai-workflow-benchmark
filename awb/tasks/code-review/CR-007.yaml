id: CR-007
category: code-review
title: Audit dependency versions and fix unpinned packages in requirements.txt
difficulty: hard
estimated_minutes: 15
languages:
- python
tags:
- fastapi
- dependencies
- supply-chain
- security
- pinning
capabilities:
- security_awareness
repo:
  url: https://github.com/tiangolo/fastapi
  commit: 628c34e0cae200564d191c95d7edea78c88c4b5e
  setup_commands:
  - python3 -m venv .venv && source .venv/bin/activate && pip install -e '.[all]' && pip install
    pytest
issue:
  description: "A FastAPI project's requirements.txt contains a mix of pinned and unpinned\ndependencies.\
    \ Unpinned packages (using >=, ^, ~, or no version at all)\nallow pip to install any newer version,\
    \ which can introduce breaking\nchanges or security vulnerabilities without an explicit decision\
    \ to upgrade.\n\nCreate requirements.txt with 8 dependencies \u2014 3 correctly pinned, 3 with\n\
    loose version specifiers, and 2 with no version at all:\n\n  # Correctly pinned (good)\n  fastapi==0.109.0\n\
    \  uvicorn==0.27.0\n  pydantic==2.6.0\n\n  # Loose specifiers (bad)\n  httpx>=0.26.0\n  sqlalchemy>=2.0.0,<3.0.0\n\
    \  alembic~=1.13.0\n\n  # No version (bad)\n  requests\n  python-dotenv\n\nCreate audit/check_deps.py\
    \ \u2014 a script that:\n  - Reads requirements.txt line by line\n  - Skips blank lines and comments\
    \ (#)\n  - For each dependency line, checks whether it is pinned with ==\n  - Prints a PASS or\
    \ FAIL line for each dependency\n  - Exits with code 1 if any dependency is not pinned exactly\
    \ with ==\n  - Example output:\n      [PASS] fastapi==0.109.0\n      [FAIL] httpx>=0.26.0 \u2014\
    \ not pinned to exact version\n      [FAIL] requests \u2014 no version specified\n\nFix requirements.txt:\
    \ pin all 8 dependencies to exact versions using ==.\nThe chosen version numbers must be realistic\
    \ (look up actual published\nversions or use plausible version strings like 2.31.0 for requests).\n\
    \nCreate tests/test_audit.py that:\n  - Import and call the audit logic (or subprocess the script)\n\
    \  - Verify that the fixed requirements.txt has all 8 packages pinned\n  - Assert that no line\
    \ with a real package name uses >=, ~=, ^, or has\n    no version specifier at all\n  - Assert\
    \ that the audit script exits 0 when all packages are pinned\n  - Assert that the audit script\
    \ exits 1 when given a file with an\n    unpinned package\n\nYour task:\n  1. Create requirements.txt\
    \ with 8 packages as described (mixed pinning).\n  2. Create audit/check_deps.py that detects\
    \ unpinned packages.\n  3. Fix requirements.txt to pin all 8 packages exactly with ==.\n  4.\
    \ Create tests/test_audit.py and confirm all tests pass.\n"
  files_to_examine:
  - requirements.txt
  - audit/check_deps.py
  - tests/test_audit.py
verification:
  test_commands:
  - source .venv/bin/activate && python3 -m pytest tests/test_audit.py -v
  lint_commands:
  - source .venv/bin/activate && ruff check audit/check_deps.py
  security_commands: []
  partial_credit:
  - criterion: Scanner accepts pins and rejects unpinned inputs
    points: 50
    check: awb-oracle CR-007 detection
  - criterion: Exactly the eight requested packages have exact pins
    points: 50
    check: awb-oracle CR-007 pins
constraints:
  max_iterations: 15
  timeout_seconds: 332
