id: CR-008
category: code-review
title: "Security review of FastAPI middleware — write report only, no code changes"
difficulty: hard
estimated_minutes: 30
languages: [python]
tags: [fastapi, security, middleware, cors, timing-attack, rate-limiting]
capabilities: [security_awareness, code_comprehension]

repo:
  url: "https://github.com/tiangolo/fastapi"
  commit: "628c34e0cae200564d191c95d7edea78c88c4b5e"
  setup_commands:
    - "python3 -m venv .venv && source .venv/bin/activate && pip install -e '.[all]' && pip install pytest"

issue:
  description: |
    You are a security reviewer. Your task is to read the following application
    code, identify security issues, and write a report. You must NOT modify any
    source file. Only create review/security_report.md.

    Create app/middleware.py with these four intentionally flawed implementations:

      import time
      import hmac
      from fastapi import FastAPI, Request, HTTPException
      from fastapi.middleware.cors import CORSMiddleware
      from starlette.responses import Response

      app = FastAPI()

      # --- Flaw 1: Rate limiter with no TTL ---
      # Request counts accumulate forever. A client that sends 1 req/hour will
      # eventually be blocked even though it is well within any reasonable rate.
      _request_counts: dict[str, int] = {}
      RATE_LIMIT = 100

      @app.middleware("http")
      async def rate_limit(request: Request, call_next):
          ip = request.client.host
          _request_counts[ip] = _request_counts.get(ip, 0) + 1
          if _request_counts[ip] > RATE_LIMIT:
              raise HTTPException(status_code=429, detail="Rate limit exceeded")
          return await call_next(request)

      # --- Flaw 2: Token comparison vulnerable to timing attack ---
      # String equality (==) short-circuits on the first differing byte,
      # leaking how many characters of the token are correct via response time.
      VALID_TOKEN = "supersecrettoken123"

      @app.get("/admin")
      async def admin(request: Request):
          auth = request.headers.get("Authorization", "")
          token = auth.removeprefix("Bearer ").strip()
          if token != VALID_TOKEN:           # timing-attack: use hmac.compare_digest
              raise HTTPException(status_code=401, detail="Unauthorized")
          return {"message": "admin access granted"}

      # --- Flaw 3: CORS allows credentials with wildcard origin ---
      # allow_origins=["*"] with allow_credentials=True is rejected by browsers
      # and is a misconfiguration that signals no real thought was given to CORS.
      app.add_middleware(
          CORSMiddleware,
          allow_origins=["*"],
          allow_credentials=True,
          allow_methods=["*"],
          allow_headers=["*"],
      )

      # --- Flaw 4: Logging middleware logs full request body ---
      # Passwords, tokens, and PII in POST bodies are written to logs in plaintext.
      import logging
      logger = logging.getLogger(__name__)

      @app.middleware("http")
      async def log_requests(request: Request, call_next):
          body = await request.body()
          logger.info(f"Request body: {body.decode()}")   # logs passwords & PII
          response = await call_next(request)
          return response

    Your task:
      1. Read app/middleware.py carefully.
      2. Write review/security_report.md documenting all four security issues.
         Each issue must include: the flaw name, which lines it appears on,
         why it is a security problem, and the recommended fix.
      3. Do NOT modify app/middleware.py or any other source file.
         The verification step will check that source files are unchanged.

    The report must cover all four issues:
      - Rate limiter with no TTL (permanent memory growth, eventual false-positives)
      - Timing attack on token comparison (use hmac.compare_digest or secrets.compare_digest)
      - CORS misconfiguration (wildcard origin + allow_credentials is invalid/dangerous)
      - Password/PII logging in request body middleware
  files_to_examine:
    - "app/middleware.py"

verification:
  test_commands:
    - "test -f review/security_report.md"
  lint_commands: []
  security_commands: []
  partial_credit:
    - criterion: "Report file exists at review/security_report.md"
      points: 15
      check: "test -f review/security_report.md"
    - criterion: "Report identifies the rate limiter TTL issue"
      points: 15
      check: "grep -qiE 'ttl|accumulate|permanent|never.?reset|grows.?forever' review/security_report.md"
    - criterion: "Report identifies the timing attack on token comparison"
      points: 15
      check: "grep -qiE 'timing.?attack|compare_digest|hmac|constant.?time|short.?circuit' review/security_report.md"
    - criterion: "Report identifies the CORS wildcard + credentials misconfiguration"
      points: 15
      check: "grep -qiE 'cors|wildcard|allow_credentials|allow_origins.*\\*|\\*.*credentials' review/security_report.md"
    - criterion: "Report identifies password/PII logging in request body"
      points: 15
      check: "grep -qiE 'password|pii|log.*body|body.*log|plaintext|sensitive' review/security_report.md"
    - criterion: "Source file app/middleware.py is unchanged (no lines added or removed)"
      points: 25
      check: "grep -c '' app/middleware.py | grep -qE '^(34|35|36|37|38|39|40)$' && grep -q 'supersecrettoken123' app/middleware.py && grep -q 'allow_origins.*\\*' app/middleware.py"

constraints:
  max_iterations: 20
  timeout_seconds: 204

