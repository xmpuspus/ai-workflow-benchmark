id: DB-001
category: debugging
title: "Diagnose why test passes in isolation but fails in full suite"
difficulty: medium
estimated_minutes: 30
languages: [python]
tags: [pytest, shared-state, test-isolation, fixtures]
capabilities: [bug_diagnosis, test_writing]

repo:
  url: "https://github.com/tiangolo/fastapi"
  commit: "628c34e0cae200564d191c95d7edea78c88c4b5e"
  setup_commands:
    - "python3 -m venv .venv && source .venv/bin/activate && pip install -e '.[all]' && pip install pytest httpx"

issue:
  description: |
    Two test files exist in the project: tests/test_users.py and tests/test_items.py.
    Both pass when run individually but test_items.py fails when the full suite
    runs with `pytest tests/`.

    tests/test_users.py imports a module-level list `USER_STORE` from
    app/store.py and appends a user to it in a test. tests/test_items.py
    imports the same `USER_STORE` and asserts it is empty at the start of its
    test. When pytest collects both files, test_users.py runs first and leaves
    USER_STORE in a dirty state, causing test_items.py to fail.

    Your task:
    1. Create app/store.py with a module-level list USER_STORE = [].
    2. Create tests/test_users.py that appends {"id": 1, "name": "alice"} to
       USER_STORE and asserts len(USER_STORE) == 1.
    3. Create tests/test_items.py that asserts USER_STORE is empty before
       reading it.
    4. Reproduce the failure by running `pytest tests/` and observe the error.
    5. Fix the shared state issue. Acceptable fixes include:
       - A pytest fixture with function scope in tests/conftest.py that
         resets USER_STORE before each test.
       - Moving USER_STORE construction into a fixture rather than module level.
    6. Verify both tests pass together with `pytest tests/ -v`.

    The fix must not change the test assertions — only the isolation mechanism.
  files_to_examine:
    - "tests/"
    - "app/store.py"

verification:
  test_commands:
    - "source .venv/bin/activate && python3 -m pytest tests/test_users.py tests/test_items.py -v"
  lint_commands:
    - "source .venv/bin/activate && ruff check tests/ app/store.py"
  security_commands: []
  partial_credit:
    - criterion: "Shared module-level state identified as root cause"
      points: 25
      check: "grep -qE 'USER_STORE|module.level|shared.state' tests/conftest.py"
    - criterion: "Fixture or reset mechanism added to isolate state"
      points: 25
      check: "grep -q 'fixture' tests/conftest.py"
    - criterion: "Both tests pass in isolation"
      points: 10
      check: "source .venv/bin/activate && python3 -m pytest tests/test_users.py tests/test_items.py -v --collect-only"
    - criterion: "Both tests pass together in full suite"
      points: 20
      check: "source .venv/bin/activate && python3 -m pytest tests/test_users.py tests/test_items.py -v"
    - criterion: "No lint warnings"
      points: 20
      check: "source .venv/bin/activate && ruff check tests/ app/store.py"

constraints:
  max_iterations: 20
  timeout_seconds: 1200
