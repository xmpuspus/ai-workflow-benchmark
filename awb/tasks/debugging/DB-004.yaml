id: DB-004
category: debugging
title: "Find root cause of connection pool exhausted error under load"
difficulty: hard
estimated_minutes: 45
languages: [python]
tags: [fastapi, sqlalchemy, async, connection-pool, resource-leak]
capabilities: [bug_diagnosis, code_comprehension]

repo:
  url: "https://github.com/tiangolo/fastapi"
  commit: "628c34e0cae200564d191c95d7edea78c88c4b5e"
  setup_commands:
    - "python3 -m venv .venv && source .venv/bin/activate && pip install -e '.[all]' && pip install pytest httpx 'sqlalchemy[asyncio]' aiosqlite"

issue:
  description: |
    An async FastAPI application starts returning 500 errors under modest load.
    The error message is "QueuePool limit of size 5 overflow 0 reached". The
    connection pool is configured with pool_size=5 but connections are never
    returned to it under certain code paths.

    Your task:
    1. Create db/session.py with an async SQLAlchemy engine configured with
       pool_size=5 and an async session factory. Use aiosqlite as the driver
       (connection string: "sqlite+aiosqlite:///./test.db").
    2. Create routes/reports.py with a POST /reports endpoint that:
       - Opens an async session.
       - Simulates a long query (asyncio.sleep(0.1)).
       - In the except clause, raises an HTTPException WITHOUT closing the
         session (the bug: the session is not in a finally block).
    3. Create app/main.py that includes the reports router and 3 other
       placeholder endpoints (GET /health, GET /status, GET /ping) that return
       simple dicts.
    4. Create tests/test_pool.py that:
       - Sends 6 concurrent requests to POST /reports using asyncio.gather
         to trigger 6 simultaneous sessions against a pool of size 5.
       - Asserts that without the fix, pool exhaustion occurs (catches
         TimeoutError or checks for 500 responses).
       - Applies the fix (wrapping the session in a try/finally or using an
         async context manager) and asserts all 6 requests succeed.
    5. The fix must use either async context manager (`async with session`)
       or a try/finally block that closes the session unconditionally.
  files_to_examine:
    - "db/session.py"
    - "routes/reports.py"
    - "app/main.py"
    - "tests/test_pool.py"

verification:
  test_commands:
    - "source .venv/bin/activate && python3 -m pytest tests/test_pool.py -v"
  lint_commands:
    - "source .venv/bin/activate && ruff check db/ routes/ app/ tests/test_pool.py"
  security_commands: []
  partial_credit:
    - criterion: "Missing finally block in error path identified"
      points: 20
      check: "grep -qE 'finally|async with' routes/reports.py"
    - criterion: "Session closed unconditionally via finally or context manager"
      points: 25
      check: "grep -qE 'finally.*close|async with.*session' routes/reports.py"
    - criterion: "Test demonstrates the leak scenario"
      points: 15
      check: "grep -qE 'gather|concurrent' tests/test_pool.py"
    - criterion: "Test proves fix prevents pool exhaustion"
      points: 15
      check: "grep -qE 'assert.*200|assert.*success' tests/test_pool.py"
    - criterion: "Tests pass"
      points: 25
      check: "source .venv/bin/activate && python3 -m pytest tests/test_pool.py -v"

constraints:
  max_iterations: 25
  timeout_seconds: 798
