    - criterion: "Unauthorized WebSocket connection rejected"
      points: 15
      check: "grep -qE 'WebSocketException|WS_1008|policy_violation' auth/ws_dependencies.py"
    - criterion: "Test for REST auth exists and passes"
      points: 10
      check: "grep -qE 'test_rest_auth|Bearer' tests/test_ws_auth.py"
    - criterion: "Test for WebSocket auth exists"
      points: 10
      check: "grep -qE 'test_ws_auth|websocket.*token' tests/test_ws_auth.py"
    - criterion: "Tests pass"
      points: 20
      check: "source .venv/bin/activate && python3 -m pytest tests/test_ws_auth.py -v"

