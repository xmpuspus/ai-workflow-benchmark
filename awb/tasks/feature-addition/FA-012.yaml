id: FA-012
category: feature-addition
title: "Add TypeScript types to an untyped Hono API handler"
difficulty: medium
estimated_minutes: 30
languages: [typescript]
tags: [hono, typescript, strict-mode, type-safety, interfaces]
capabilities: [framework_knowledge, code_comprehension]

repo:
  url: "https://github.com/honojs/hono"
  commit: "42039738802133f6d28e2e2ab30bb7a5c13d560b"
  setup_commands:
    - "npm install && npm install -D typescript @types/node"

issue:
  description: |
    An untyped Hono API handler uses `any` everywhere for request and response
    objects. Your job is to define proper TypeScript interfaces and replace all
    `any` types so the file passes `tsc --noEmit --strict` with zero errors.

    Step 1 - Create the untyped handler at handlers/users.ts:

    ```typescript
    import { Hono } from "hono";

    const app = new Hono();

    // In-memory store — do not change this
    const users: any[] = [];
    let nextId = 1;

    function buildUser(data: any): any {
      return {
        id: nextId++,
        name: data.name,
        email: data.email,
        role: data.role ?? "member",
        createdAt: new Date().toISOString(),
      };
    }

    function validateCreateRequest(body: any): any {
      if (!body.name || typeof body.name !== "string") {
        return { error: "name is required and must be a string" };
      }
      if (!body.email || typeof body.email !== "string") {
        return { error: "email is required and must be a string" };
      }
      return null;
    }

    app.get("/users", (c: any) => {
      return c.json({ data: users });
    });

    app.get("/users/:id", (c: any) => {
      const id = parseInt(c.req.param("id"), 10);
      const user = users.find((u: any) => u.id === id);
      if (!user) {
        return c.json({ error: "not found" }, 404);
      }
      return c.json({ data: user });
    });

    app.post("/users", async (c: any) => {
      const body: any = await c.req.json();
      const err = validateCreateRequest(body);
      if (err) {
        return c.json(err, 400);
      }
      const user = buildUser(body);
      users.push(user);
      return c.json({ data: user }, 201);
    });

    app.patch("/users/:id", async (c: any) => {
      const id = parseInt(c.req.param("id"), 10);
      const idx = users.findIndex((u: any) => u.id === id);
      if (idx === -1) {
        return c.json({ error: "not found" }, 404);
      }
      const body: any = await c.req.json();
      users[idx] = { ...users[idx], ...body, id };
      return c.json({ data: users[idx] });
    });

    export default app;
    ```

    Step 2 - Create types/api.ts with proper TypeScript interfaces:
      - User: id (number), name (string), email (string), role (string), createdAt (string)
      - CreateUserRequest: name (string), email (string), role (optional string)
      - UpdateUserRequest: name, email, role — all optional (Partial equivalent)
      - ApiResponse<T>: data field of type T
      - ApiError: error field of type string

    Step 3 - Rewrite handlers/users.ts to replace every `any` with the proper
    interfaces from types/api.ts. The handler logic must remain identical.
    Constraints:
      - Import types from ../types/api
      - Use Context from hono (not any) for route handler parameters
      - The in-memory users array must be typed as User[]
      - buildUser must accept CreateUserRequest and return User
      - validateCreateRequest must accept CreateUserRequest and return ApiError | null

    Step 4 - Create tests/users.test.ts using Hono's app.request() pattern
    (same pattern used in RF-004):
      - GET /users returns 200 with { data: [] } initially
      - POST /users with valid body returns 201 with created user
      - POST /users with missing name returns 400
      - GET /users/:id returns the user after creation
      - GET /users/:id for unknown id returns 404
      - PATCH /users/:id updates and returns the user
      - PATCH /users/:id for unknown id returns 404

    All tests must pass. Running `npx tsc --noEmit --strict handlers/users.ts`
    must produce zero errors after your changes.

  files_to_examine:
    - "src/hono.ts"
    - "src/context.ts"
    - "src/types.ts"

verification:
  test_commands:
    - "npx tsc --noEmit --strict handlers/users.ts && npx vitest run tests/users.test.ts"
  lint_commands:
    - "npx tsc --noEmit --strict handlers/users.ts"
  security_commands: []
  partial_credit:
    - criterion: "types/api.ts created with required interfaces"
      points: 15
      check: "test -f types/api.ts && grep -qE 'interface User' types/api.ts && grep -qE 'interface.*Request' types/api.ts && grep -qE 'ApiResponse' types/api.ts"
    - criterion: "No any types remaining in handlers/users.ts"
      points: 25
      check: "! grep -qE ':\\s*any\\b|<any>|\\bany\\[\\]' handlers/users.ts"
    - criterion: "Handler imports types from types/api"
      points: 10
      check: "grep -qE 'from.*types/api|from.*\\.\\./types/api' handlers/users.ts"
    - criterion: "ApiResponse<T> is a generic interface"
      points: 15
      check: "grep -qE 'interface ApiResponse<T>' types/api.ts || grep -qE 'type ApiResponse<T>' types/api.ts"
    - criterion: "tsc --strict passes with zero errors"
      points: 25
      check: "npx tsc --noEmit --strict handlers/users.ts"
    - criterion: "Tests pass"
      points: 10
      check: "npx vitest run tests/users.test.ts"

constraints:
  max_iterations: 20
  timeout_seconds: 1200
