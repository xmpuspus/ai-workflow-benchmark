id: LC-004
category: legacy-code
title: "Fix Python 3.12 deprecation warnings in a Flask app"
difficulty: easy
estimated_minutes: 30
languages: [python]
tags: [deprecation, python312, flask, modernization]
capabilities: [code_comprehension, framework_knowledge]

repo:
  url: "https://github.com/pallets/flask"
  commit: "22d924701a6ae2e4cd01e9a15bbaf3946094af65"
  setup_commands:
    - "python3 -m venv .venv && source .venv/bin/activate && pip install -e '.[async]' && pip install pytest"

issue:
  description: |
    A Flask application spread across 5 files triggers 8 different
    DeprecationWarnings under Python 3.12. Fix all 8 by replacing each
    deprecated pattern with its modern equivalent.

    Step 1 — Create these 5 files:

    legacy/dt_utils.py  (patterns 1 and 2):
      from datetime import datetime

      def current_time():
          return datetime.utcnow()                      # pattern 1

      def from_stamp(ts):
          return datetime.utcfromtimestamp(ts)          # pattern 2

    legacy/file_utils.py  (pattern 3):
      import cgi

      def parse_form(environ):
          return cgi.FieldStorage(environ=environ)      # pattern 3: cgi deprecated

    legacy/res_utils.py  (pattern 4):
      import importlib.resources as pkg

      def read_config():
          return pkg.open_text("legacy", "config.txt")  # pattern 4: open_text deprecated

    legacy/load_utils.py  (patterns 5 and 6):
      import pkgutil
      import sqlite3

      def find_mod(name):
          return pkgutil.find_loader(name)              # pattern 5: find_loader deprecated

      def adapt_bool(value):
          # sqlite3 used to auto-adapt bools via default adapters; now deprecated
          conn = sqlite3.connect(":memory:")
          conn.execute("CREATE TABLE t (v)")
          conn.execute("INSERT INTO t VALUES (?)", (bool(value),))  # pattern 6
          return conn

    legacy/type_utils.py  (patterns 7 and 8):
      from typing import Optional
      import asyncio

      def maybe_str(value) -> Optional[str]:            # pattern 7: Optional deprecated
          return str(value) if value else None

      def get_loop():
          return asyncio.get_event_loop()               # pattern 8: deprecated outside running loop

    Step 2 — Create tests/test_deprecations.py that runs each function and
    captures warnings:

      import warnings
      import pytest

      def test_no_deprecation_warnings():
          with warnings.catch_warnings():
              warnings.simplefilter("error", DeprecationWarning)
              from legacy.dt_utils import current_time, from_stamp
              current_time()
              from_stamp(0)

    Step 3 — Fix all 8 deprecated patterns across the 5 files:
    1. datetime.utcnow() → datetime.now(timezone.utc)
    2. datetime.utcfromtimestamp() → datetime.fromtimestamp(ts, tz=timezone.utc)
    3. cgi.FieldStorage → use email.parser or urllib.parse.parse_qs instead
    4. importlib.resources.open_text → use importlib.resources.files().joinpath().open()
    5. pkgutil.find_loader → use importlib.util.find_spec()
    6. sqlite3 default boolean adapter → register an explicit adapter with sqlite3.register_adapter
    7. typing.Optional[X] → X | None
    8. asyncio.get_event_loop() → asyncio.new_event_loop() or asyncio.get_event_loop_policy().get_event_loop()

    Requirements:
    - All 8 patterns must be replaced with their modern equivalents.
    - Running the test suite must produce zero DeprecationWarnings.
    - Tests must pass.
  files_to_examine:
    - "legacy/dt_utils.py"
    - "legacy/file_utils.py"
    - "legacy/res_utils.py"
    - "legacy/load_utils.py"
    - "legacy/type_utils.py"
    - "tests/test_deprecations.py"

verification:
  test_commands:
    - "source .venv/bin/activate && python3 -m pytest tests/test_deprecations.py -v -W error::DeprecationWarning"
  lint_commands:
    - "source .venv/bin/activate && ruff check legacy/"
  security_commands: []
  partial_credit:
    - criterion: "At least 6 of 8 patterns fixed"
      points: 20
      check: "! grep -rE 'utcnow|utcfromtimestamp|import cgi|open_text|find_loader' legacy/ 2>/dev/null | grep -v test | grep -v '.pyc'"
    - criterion: "All 8 patterns fixed"
      points: 15
      check: "! grep -rE 'utcnow|utcfromtimestamp|cgi\\.FieldStorage|open_text|find_loader|Optional\\[' legacy/ 2>/dev/null | grep -v '.pyc'"
    - criterion: "Modern alternatives used correctly"
      points: 20
      check: "grep -rE 'timezone\\.utc|find_spec|files\\(\\)' legacy/ | wc -l | awk '{exit ($1 < 2)}'"
    - criterion: "No DeprecationWarning emitted during test run"
      points: 20
      check: "source .venv/bin/activate && python3 -W error::DeprecationWarning -m pytest tests/test_deprecations.py -v 2>&1 | grep -qv 'DeprecationWarning'"
    - criterion: "Tests pass"
      points: 25
      check: "source .venv/bin/activate && python3 -m pytest tests/test_deprecations.py -v"

constraints:
  max_iterations: 20
  timeout_seconds: 377
