id: LC-008
category: legacy-code
title: "Upgrade Pydantic v1 models to v2 in a FastAPI app"
difficulty: easy
estimated_minutes: 30
languages: [python]
tags: [pydantic, pydantic-v2, fastapi, migration]
capabilities: [framework_knowledge, refactoring_discipline]

repo:
  url: "https://github.com/tiangolo/fastapi"
  commit: "628c34e0cae200564d191c95d7edea78c88c4b5e"
  setup_commands:
    - "python3 -m venv .venv && source .venv/bin/activate && pip install -e '.[all]' && pip install pytest httpx"

issue:
  description: |
    Three model files use Pydantic v1 patterns that are deprecated or removed
    in Pydantic v2. Migrate all models to use Pydantic v2 APIs.

    Step 1 — Create these 3 model files using v1 patterns:

    models/user.py:
      from typing import Optional
      from pydantic import BaseModel

      class User(BaseModel):
          id: int
          name: str
          email: Optional[str]

          class Config:
              title = "User"

      class UserCreate(BaseModel):
          name: str
          email: Optional[str]

          class Config:
              title = "UserCreate"

    models/item.py:
      from typing import Optional, List
      from pydantic import BaseModel

      class Item(BaseModel):
          id: int
          title: str
          tags: Optional[List[str]]

          class Config:
              title = "Item"

      class ItemCreate(BaseModel):
          title: str
          tags: Optional[List[str]]

    models/order.py:
      from typing import Optional
      from pydantic import BaseModel

      class Order(BaseModel):
          id: int
          user_id: int
          total: float
          notes: Optional[str]

          class Config:
              title = "Order"
              validate_assignment = True

    Step 2 — Create tests/test_models.py that exercises all 5 v1 patterns
    being replaced:

      import pytest
      from models.user import User, UserCreate
      from models.item import Item, ItemCreate
      from models.order import Order

      def test_user_model_dump():
          u = User(id=1, name="Alice", email="a@example.com")
          d = u.model_dump()
          assert d["id"] == 1

      def test_user_model_validate():
          u = User.model_validate({"id": 2, "name": "Bob", "email": None})
          assert u.name == "Bob"

      def test_item_model_dump():
          item = Item(id=1, title="Widget", tags=["a", "b"])
          assert item.model_dump()["title"] == "Widget"

      def test_order_model_json_schema():
          schema = Order.model_json_schema()
          assert "Order" in schema.get("title", "")

      def test_user_create():
          uc = UserCreate(name="Carol", email=None)
          assert uc.name == "Carol"

    Step 3 — Migrate all 3 model files to Pydantic v2:
    - Replace `class Config:` with `model_config = ConfigDict(...)` (import
      ConfigDict from pydantic).
    - Replace `.dict()` calls with `.model_dump()`.
    - Replace `parse_obj(data)` calls with `Model.model_validate(data)`.
    - Replace `.schema()` calls with `.model_json_schema()`.
    - Replace `Optional[X]` with `X | None` throughout.
    - Replace `List[X]` with `list[X]` throughout.
    - Remove `from typing import Optional, List` if no longer needed.

    Requirements:
    - All 3 model files must use ConfigDict instead of class Config.
    - No `Optional[` or `List[` type hints remaining.
    - Tests must use model_dump, model_validate, model_json_schema (v2 API).
    - Tests must pass under the Pydantic v2 installation bundled with FastAPI.
  files_to_examine:
    - "models/user.py"
    - "models/item.py"
    - "models/order.py"
    - "tests/test_models.py"

verification:
  test_commands:
    - "source .venv/bin/activate && python3 -m pytest tests/test_models.py -v"
  lint_commands:
    - "source .venv/bin/activate && ruff check models/"
  security_commands: []
  partial_credit:
    - criterion: "ConfigDict used in all 3 model files"
      points: 15
      check: "grep -rl 'ConfigDict' models/user.py models/item.py models/order.py | wc -l | awk '{exit ($1 < 3)}'"
    - criterion: "model_dump replaces .dict()"
      points: 15
      check: "! grep -r '\\.dict()' models/ && grep -r 'model_dump' tests/test_models.py"
    - criterion: "model_validate replaces parse_obj"
      points: 15
      check: "! grep -r 'parse_obj' models/ && grep -r 'model_validate' tests/test_models.py"
    - criterion: "All 3 model files migrated (no class Config remaining)"
      points: 15
      check: "! grep -r 'class Config' models/"
    - criterion: "No v1 type patterns remaining (Optional[, List[)"
      points: 15
      check: "! grep -rE 'Optional\\[|List\\[' models/"
    - criterion: "Tests pass"
      points: 25
      check: "source .venv/bin/activate && python3 -m pytest tests/test_models.py -v"

constraints:
  max_iterations: 20
  timeout_seconds: 297
