id: MF-008
category: multi-file
title: "Refactor a monolithic test file into 5 focused test modules with shared fixtures"
difficulty: hard
estimated_minutes: 30
languages: [python]
tags: [pytest, test-organization, conftest, fixtures, refactoring]
capabilities: [multi_file_reasoning, refactoring_discipline, test_writing]

repo:
  url: "https://github.com/tiangolo/fastapi"
  commit: "628c34e0cae200564d191c95d7edea78c88c4b5e"
  setup_commands:
    - "python3 -m venv .venv && source .venv/bin/activate && pip install -e '.[all]' && pip install pytest httpx"

issue:
  description: |
    A FastAPI project has a single test file tests/test_app.py containing 20
    test functions across five concerns: auth (4 tests), users (4 tests),
    items (4 tests), orders (4 tests), and error handling (4 tests). The file
    has grown unwieldy and each group duplicates the TestClient fixture setup.

    Your task:
    1. Create the FastAPI application. You need app/main.py with five routers:
       - auth: POST /auth/login (returns token), GET /auth/me (protected).
       - users: GET /users, POST /users, GET /users/{id}, DELETE /users/{id}.
       - items: GET /items, POST /items, GET /items/{id}, DELETE /items/{id}.
       - orders: GET /orders, POST /orders, GET /orders/{id}, PATCH /orders/{id}.
       - errors: GET /errors/not-found (raises 404), GET /errors/server-error
         (raises 500).
       Use in-memory stores (dicts) for all data. Keep each router simple.

    2. Create tests/test_app.py with exactly 20 test functions covering all
       five areas. Each test must have a self-contained client fixture setup
       (the thing being refactored away). The file should be ~100-120 lines
       and intentionally monolithic.

    3. Refactor into 5 focused test files plus conftest:
       tests/conftest.py — shared client fixture and any shared test data.
       tests/test_auth.py — 4 auth tests.
       tests/test_users.py — 4 user tests.
       tests/test_items.py — 4 item tests.
       tests/test_orders.py — 4 order tests.
       tests/test_errors.py — 4 error handling tests.

    4. Requirements for the refactor:
       - All 20 tests must be present and unchanged in their assertions.
       - No test file may define a `client` fixture — it must come from conftest.
       - No fixture defined in conftest.py may be duplicated in any test file.
       - pytest must discover all 20 tests with `pytest tests/ --collect-only`.
       - The original tests/test_app.py may be deleted after splitting.

    5. Verify by running `pytest tests/ -v` and confirming 20 tests pass.
  files_to_examine:
    - "app/"
    - "tests/"

verification:
  test_commands:
    - "source .venv/bin/activate && python3 -m pytest tests/ -v --ignore=tests/test_app.py"
  lint_commands:
    - "source .venv/bin/activate && ruff check app/ tests/"
  security_commands: []
  partial_credit:
    - criterion: "All 5 focused test files created (test_auth, test_users, test_items, test_orders, test_errors)"
      points: 15
      check: "ls tests/test_auth.py tests/test_users.py tests/test_items.py tests/test_orders.py tests/test_errors.py"
    - criterion: "conftest.py defines shared client fixture"
      points: 15
      check: "grep -q 'def client' tests/conftest.py"
    - criterion: "All 20 test functions present across the 5 files"
      points: 15
      check: "source .venv/bin/activate && python3 -m pytest tests/ --collect-only --ignore=tests/test_app.py -q | grep -c 'test_'"
    - criterion: "pytest discovers all tests without errors"
      points: 15
      check: "source .venv/bin/activate && python3 -m pytest tests/ --collect-only --ignore=tests/test_app.py -q"
    - criterion: "No client fixture duplicated in individual test files"
      points: 10
      check: "grep -rqv 'def client' tests/test_auth.py tests/test_users.py tests/test_items.py tests/test_orders.py tests/test_errors.py"
    - criterion: "All tests pass"
      points: 30
      check: "source .venv/bin/activate && python3 -m pytest tests/ -v --ignore=tests/test_app.py"

constraints:
  max_iterations: 20
  timeout_seconds: 1126
