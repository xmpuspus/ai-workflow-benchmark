id: MF-010
category: multi-file
title: "Fix breaking changes after upgrading Pydantic from v1 to v2 patterns"
difficulty: hard
estimated_minutes: 45
languages: [python]
tags: [fastapi, pydantic, migration, multi-file-reasoning, breaking-changes]
capabilities: [framework_knowledge, multi_file_reasoning, refactoring_discipline]

repo:
  url: "https://github.com/tiangolo/fastapi"
  commit: "628c34e0cae200564d191c95d7edea78c88c4b5e"
  setup_commands:
    - "python3 -m venv .venv && source .venv/bin/activate && pip install -e '.[all]' && pip install 'pydantic>=2.0' pytest pytest-asyncio httpx"

issue:
  description: |
    This codebase was written with Pydantic v1 patterns. The project has been
    upgraded to Pydantic v2 but the model files have NOT been updated — they
    still use v1 idioms that either no longer work or behave differently.
    Your job is to migrate all 4 model files to proper Pydantic v2 patterns
    and ensure the tests pass.

    Step 1 - Create the 4 model files using v1 patterns. These patterns are
    DELIBERATELY WRONG for Pydantic v2 — do not fix them in this step.

    models/__init__.py  (empty)

    models/user.py (v1 pattern: class Config):
      ```python
      from pydantic import BaseModel


      class UserBase(BaseModel):
          name: str
          email: str

          class Config:
              str_strip_whitespace = True
              str_min_length = 1


      class UserCreate(UserBase):
          password: str


      class UserResponse(UserBase):
          id: int
          is_active: bool = True

          class Config:
              from_attributes = True
      ```

    models/item.py (v1 pattern: .dict() method):
      ```python
      from pydantic import BaseModel
      from typing import Optional


      class ItemBase(BaseModel):
          name: str
          price: float
          description: Optional[str] = None


      class ItemCreate(ItemBase):
          pass


      class ItemResponse(ItemBase):
          id: int
          owner_id: int


      def serialize_item(item: ItemResponse) -> dict:
          return item.dict()


      def serialize_items(items: list[ItemResponse]) -> list[dict]:
          return [item.dict(exclude_none=True) for item in items]
      ```

    models/order.py (v1 pattern: parse_obj()):
      ```python
      from pydantic import BaseModel
      from typing import Optional
      from datetime import datetime


      class OrderItem(BaseModel):
          item_id: int
          quantity: int
          unit_price: float


      class Order(BaseModel):
          id: int
          user_id: int
          items: list[OrderItem]
          total: float
          status: str = "pending"
          created_at: Optional[datetime] = None


      def order_from_dict(data: dict) -> Order:
          return Order.parse_obj(data)


      def order_item_from_dict(data: dict) -> OrderItem:
          return OrderItem.parse_obj(data)
      ```

    models/response.py (v1 pattern: schema()):
      ```python
      from pydantic import BaseModel
      from typing import Generic, TypeVar

      T = TypeVar("T")


      class PaginatedResponse(BaseModel):
          items: list
          total: int
          page: int
          page_size: int


      class ApiResponse(BaseModel, Generic[T]):
          data: T
          success: bool = True
          message: str = ""


      def get_paginated_schema() -> dict:
          return PaginatedResponse.schema()


      def get_api_response_schema() -> dict:
          return ApiResponse.schema()
      ```

    Step 2 - Create routes/items_route.py that uses the models:
      ```python
      from fastapi import FastAPI
      from models.item import ItemCreate, ItemResponse, serialize_item
      from models.order import Order, order_from_dict
      from models.response import ApiResponse, get_paginated_schema

      app = FastAPI()

      @app.post("/items", response_model=ApiResponse[ItemResponse])
      def create_item(item: ItemCreate):
          fake_response = ItemResponse(id=1, owner_id=42, **item.model_dump())
          return ApiResponse(data=fake_response)

      @app.get("/schema")
      def get_schema():
          return get_paginated_schema()
      ```

    Step 3 - Create tests/test_models.py that exercises all 4 model files.
    These tests will FAIL against the v1 code but must PASS after your migration:
      - UserBase strips whitespace and rejects empty strings (via model_config)
      - UserResponse.model_config has from_attributes = True
      - serialize_item returns a dict (uses model_dump internally)
      - serialize_items with exclude_none omits null fields
      - order_from_dict constructs an Order from a plain dict
      - order_item_from_dict constructs an OrderItem from a plain dict
      - get_paginated_schema returns a valid JSON schema dict with "properties" key
      - get_api_response_schema returns a valid JSON schema dict

    Step 4 - Migrate all 4 model files to Pydantic v2 patterns:
      - models/user.py: replace `class Config:` with
        `model_config = ConfigDict(str_strip_whitespace=True, str_min_length=1)`
        and the second Config with `model_config = ConfigDict(from_attributes=True)`.
        Import ConfigDict from pydantic.
      - models/item.py: replace `.dict()` with `.model_dump()` in both
        serialize_item and serialize_items.
      - models/order.py: replace `Order.parse_obj(data)` with
        `Order.model_validate(data)` and same for OrderItem.
      - models/response.py: replace `.schema()` with `.model_json_schema()` in
        both get_paginated_schema and get_api_response_schema.

    After migration, no file should contain any of these v1 patterns:
      - `class Config:`
      - `.dict(`
      - `.parse_obj(`
      - `.schema(`

    All tests must pass with Pydantic v2 installed.

  files_to_examine:
    - "fastapi/utils.py"
    - "models/user.py"
    - "models/item.py"
    - "models/order.py"
    - "models/response.py"

verification:
  test_commands:
    - "source .venv/bin/activate && python3 -m pytest tests/test_models.py -v"
  lint_commands:
    - "source .venv/bin/activate && ruff check models/"
  security_commands: []
  partial_credit:
    - criterion: "models/user.py uses ConfigDict instead of class Config"
      points: 15
      check: "grep -q 'ConfigDict' models/user.py && ! grep -q 'class Config:' models/user.py"
    - criterion: "models/item.py uses model_dump instead of .dict()"
      points: 15
      check: "grep -q 'model_dump' models/item.py && ! grep -q '.dict(' models/item.py"
    - criterion: "models/order.py uses model_validate instead of parse_obj"
      points: 15
      check: "grep -q 'model_validate' models/order.py && ! grep -q 'parse_obj' models/order.py"
    - criterion: "models/response.py uses model_json_schema instead of .schema()"
      points: 10
      check: "grep -q 'model_json_schema' models/response.py && ! grep -q '.schema(' models/response.py"
    - criterion: "All 4 files are free of v1 patterns"
      points: 15
      check: "! grep -rq 'class Config:' models/ && ! grep -rq '.dict(' models/ && ! grep -rq 'parse_obj' models/ && ! grep -rq '.schema(' models/"
    - criterion: "No v1 pattern remains anywhere in models/"
      points: 10
      check: 'python3 -c "
import subprocess, sys
result = subprocess.run([\"grep\", \"-rq\", \"class Config:\", \"models/\"], capture_output=True)
if result.returncode == 0:
    print(\"class Config: still present\")
    sys.exit(1)
result2 = subprocess.run([\"grep\", \"-rq\", \"parse_obj\", \"models/\"], capture_output=True)
if result2.returncode == 0:
    print(\"parse_obj still present\")
    sys.exit(1)
print(\"no v1 patterns found\")
"'
    - criterion: "Tests pass"
      points: 20
      check: "source .venv/bin/activate && python3 -m pytest tests/test_models.py -v"

constraints:
  max_iterations: 25
  timeout_seconds: 1800
