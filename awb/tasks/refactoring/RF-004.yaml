id: RF-004
category: refactoring
title: "Fix TypeScript strict mode violations in Hono items handler"
difficulty: medium
estimated_minutes: 30
languages: [typescript]
tags: [hono, typescript, strict-mode, type-safety, refactoring]
capabilities: [refactoring_discipline, framework_knowledge]

repo:
  url: "https://github.com/honojs/hono"
  commit: "42039738802133f6d28e2e2ab30bb7a5c13d560b"
  setup_commands:
    - "npm install"

issue:
  description: |
    Create a Hono items handler with deliberate TypeScript type safety issues,
    then fix all violations so the file passes tsc --strict and ESLint.

    Step 1 - Create src/handlers/items.ts (~150 lines) with these planted
    type safety issues:

      4x any types:
        function getItem(id: any): any { ... }
        const processData = (data: any) => { ... }
        let cache: any = null
        function handleError(err: any) { ... }

      2x non-null assertions:
        const name = item!.name
        const value = config!.value

      3x missing return types on exported functions:
        export function listItems(c: Context) { ... }  (no ': Promise<Response>')
        export function createItem(c: Context) { ... }
        export function deleteItem(c: Context) { ... }

      1x unsafe type cast:
        const item = response as any as Item  (double cast to bypass type check)

      1x loose equality:
        if (item.status == null) { ... }  (should be ===)

    The handler must define these Hono routes:
      GET /items - list all items
      GET /items/:id - get single item by id
      POST /items - create item (validates name and value from body)
      DELETE /items/:id - delete item

    Step 2 - Create tests/items.test.ts with tests using Hono's app.request():
      - GET /items returns 200 with array
      - GET /items/:id returns item when found
      - GET /items/:id returns 404 when not found
      - POST /items with valid body returns 201
      - POST /items with missing name returns 400
      - DELETE /items/:id returns 204 when deleted
      - Each test checks response status and body shape

    Step 3 - Fix all type safety violations:
      - Replace any types with proper interfaces:
          interface Item { id: string; name: string; value: number; status: string }
          interface ItemCreateRequest { name: string; value: number }
      - Remove non-null assertions; use explicit null checks instead
      - Add return types to all exported functions
      - Replace the unsafe double cast with a proper type guard or validated cast
      - Replace == null with === null or handle undefined explicitly

    All tests must pass. tsc --noEmit --strict on the file must produce zero errors.
  files_to_examine:
    - "src/hono.ts"
    - "src/context.ts"
    - "src/types.ts"

verification:
  test_commands:
    - "npx tsc --noEmit --strict src/handlers/items.ts && npx vitest run tests/items.test.ts"
  lint_commands:
    - "npx tsc --noEmit --strict src/handlers/items.ts"
  security_commands: []
  partial_credit:
    - criterion: "No any types in handler"
      points: 20
      check: "! grep -qE ':\\s*any\\b|<any>' src/handlers/items.ts"
    - criterion: "No non-null assertions"
      points: 10
      check: "! grep -q '!' src/handlers/items.ts || ! grep -qE '[a-zA-Z]!' src/handlers/items.ts"
    - criterion: "Return types on all exported functions"
      points: 15
      check: "grep -qE 'export.*function.*:\\s*Promise<Response>' src/handlers/items.ts"
    - criterion: "Item and request interfaces defined"
      points: 15
      check: "grep -qE 'interface Item|interface.*Request' src/handlers/items.ts"
    - criterion: "tsc --strict passes"
      points: 20
      check: "npx tsc --noEmit --strict src/handlers/items.ts"
    - criterion: "Tests pass"
      points: 20
      check: "npx vitest run tests/items.test.ts"

constraints:
  max_iterations: 20
  timeout_seconds: 1200
