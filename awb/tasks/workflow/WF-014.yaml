id: WF-014
category: workflow
title: "Fix concurrent AsyncSession sharing in a FastAPI batch endpoint"
difficulty: hard
estimated_minutes: 45
languages: [python]
tags: [fastapi, asyncio, concurrency, sqlalchemy, async-session]
capabilities: [framework_knowledge, security_awareness]

repo:
  url: "https://github.com/tiangolo/fastapi"
  commit: "628c34e0cae200564d191c95d7edea78c88c4b5e"
  setup_commands:
    - "python3 -m venv .venv && source .venv/bin/activate && pip install -e '.[all]' && pip install pytest httpx anyio aiosqlite sqlalchemy"
    - |
      rm -rf app tests
      mkdir -p app tests
      touch app/__init__.py
    - |
      cat > app/database.py << 'PYEOF'
      from sqlalchemy.ext.asyncio import AsyncSession, create_async_engine
      from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column

      engine = create_async_engine("sqlite+aiosqlite:///:memory:", echo=False)


      class Base(DeclarativeBase):
          pass


      class Product(Base):
          __tablename__ = "products"
          id: Mapped[int] = mapped_column(primary_key=True)
          name: Mapped[str]
          price: Mapped[float]


      async def init_db():
          async with engine.begin() as conn:
              await conn.run_sync(Base.metadata.create_all)
          async with AsyncSession(engine) as session:
              session.add_all([
                  Product(id=1, name="Widget", price=9.99),
                  Product(id=2, name="Gadget", price=19.99),
                  Product(id=3, name="Doohickey", price=4.99),
              ])
              await session.commit()
      PYEOF
    - |
      cat > app/main.py << 'PYEOF'
      import asyncio
      from contextlib import asynccontextmanager
      from fastapi import FastAPI
      from sqlalchemy import select
      from sqlalchemy.ext.asyncio import AsyncSession
      from app.database import engine, Product, init_db


      @asynccontextmanager
      async def lifespan(app):
          await init_db()
          yield


      app = FastAPI(lifespan=lifespan)


      async def fetch_product(session: AsyncSession, product_id: int) -> dict:
          result = await session.execute(select(Product).where(Product.id == product_id))
          product = result.scalar_one_or_none()
          if product is None:
              return {"id": product_id, "error": "not found"}
          return {"id": product.id, "name": product.name, "price": product.price}


      @app.get("/products/{product_id}")
      async def get_product(product_id: int):
          async with AsyncSession(engine) as session:
              return await fetch_product(session, product_id)


      # BUG: a single AsyncSession is shared across all coroutines in asyncio.gather.
      # SQLAlchemy AsyncSession is NOT safe for interleaved coroutines.
      @app.post("/batch")
      async def batch_products(product_ids: list[int]):
          async with AsyncSession(engine) as session:
              results = await asyncio.gather(
                  *[fetch_product(session, pid) for pid in product_ids]
              )
          return {"products": list(results)}
      PYEOF
    - |
      cat > tests/test_main.py << 'PYEOF'
      import pytest
      from fastapi.testclient import TestClient
      from app.main import app


      client = TestClient(app)


      def test_get_single_product():
          response = client.get("/products/1")
          assert response.status_code == 200
          assert response.json()["name"] == "Widget"


      def test_batch_single_item():
          response = client.post("/batch", json=[1])
          assert response.status_code == 200
          products = response.json()["products"]
          assert len(products) == 1
          assert products[0]["name"] == "Widget"


      def test_batch_multiple_items_each_gets_own_session():
          response = client.post("/batch", json=[1, 2, 3])
          assert response.status_code == 200
          products = response.json()["products"]
          assert len(products) == 3
          names = {p["name"] for p in products}
          assert names == {"Widget", "Gadget", "Doohickey"}


      def test_batch_preserves_gather_not_sequential():
          # Endpoint must still use asyncio.gather (not a for loop)
          import inspect
          from app import main
          src = inspect.getsource(main.batch_products)
          assert "asyncio.gather" in src


      def test_missing_product_returns_error():
          response = client.post("/batch", json=[99])
          assert response.status_code == 200
          products = response.json()["products"]
          assert products[0]["error"] == "not found"
      PYEOF

issue:
  description: |
    The POST /batch endpoint fails intermittently when fetching multiple
    products concurrently. The root cause is a concurrency safety violation.

    Run the tests to see the failure:

        python3 -m pytest tests/test_main.py -v

    The app has:
    - app/database.py — SQLAlchemy models and engine setup
    - app/main.py     — FastAPI app with /products/{id} and /batch endpoints

    Fix the concurrency issue in the /batch endpoint. Key constraints:
    - asyncio.gather must be preserved (do not convert to a sequential loop)
    - Each coroutine must get its own AsyncSession
    - Do not modify app/database.py or the tests

    All 5 tests must pass after the fix.
  files_to_examine:
    - "app/main.py"
    - "app/database.py"
    - "tests/test_main.py"

verification:
  test_commands:
    - "source .venv/bin/activate && python3 -m pytest tests/test_main.py -v"
  lint_commands:
    - "source .venv/bin/activate && ruff check app/"
  security_commands: []
  partial_credit:
    - criterion: "Root cause identified: fix is in the batch endpoint in app/main.py"
      points: 25
      check: "git diff app/main.py | grep -q '^+'"
    - criterion: "Each coroutine gets its own AsyncSession (session not shared)"
      points: 25
      check: "grep -qE 'AsyncSession.*engine' app/main.py && python3 -c \"import ast, inspect; from app import main; src = inspect.getsource(main.fetch_product); assert 'AsyncSession' in src or True\""
    - criterion: "asyncio.gather preserved in batch_products"
      points: 25
      check: "source .venv/bin/activate && python3 -m pytest tests/test_main.py::test_batch_preserves_gather_not_sequential -v"
    - criterion: "All 5 tests pass"
      points: 25
      check: "source .venv/bin/activate && python3 -m pytest tests/test_main.py -v"

constraints:
  max_iterations: 20
  timeout_seconds: 600

