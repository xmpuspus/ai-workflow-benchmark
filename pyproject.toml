[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awb"
version = "1.0.4"
description = "Benchmark harness measuring AI coding tool+workflow performance, not just model capability"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Xavier Puspus"}]
keywords = ["benchmark", "ai-coding", "claude-code", "developer-tools", "workflow", "swe-bench"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.1.0,<9",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.20.0,<5",
    "jinja2>=3.1.0,<4",
    "rich>=13.0.0,<14",
    "tabulate>=0.9.0,<1",
]

[project.urls]
Homepage = "https://github.com/xmpuspus/ai-workflow-benchmark"
Repository = "https://github.com/xmpuspus/ai-workflow-benchmark"
Documentation = "https://github.com/xmpuspus/ai-workflow-benchmark/blob/main/METHODOLOGY.md"
"Bug Tracker" = "https://github.com/xmpuspus/ai-workflow-benchmark/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.23.0,<1",
    "ruff>=0.3.0,<1",
]
stats = [
    "scipy>=1.12.0,<2",
    "numpy>=1.26.0,<3",
]
publish = [
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
awb = "awb.cli:cli"

[project.entry-points."awb.adapters"]
claude-code-vanilla = "awb.adapters.claude_code:ClaudeCodeVanillaAdapter"
claude-code-custom = "awb.adapters.claude_code:ClaudeCodeCustomAdapter"
cursor = "awb.adapters.cursor:CursorAdapter"
aider = "awb.adapters.aider:AiderAdapter"
pi = "awb.adapters.pi:PiAdapter"
gemini-cli = "awb.adapters.gemini_cli:GeminiCliAdapter"
codex-cli = "awb.adapters.codex_cli:CodexCliAdapter"
windsurf = "awb.adapters.windsurf:WindsurfAdapter"
copilot = "awb.adapters.copilot_cli:CopilotCliAdapter"

[tool.hatch.build.targets.wheel]
packages = ["awb"]

[tool.hatch.build]
include = [
    "awb/**/*.py",
    "awb/tasks/**/*.yaml",
    "awb/tasks/**/*.json",
    "awb/scoring/*.yaml",
    "awb/leaderboard/templates/**",
    "awb/leaderboard/static/**",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["demos/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["awb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
